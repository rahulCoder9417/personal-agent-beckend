name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:lint
      - name: Generated OpenAPI types are up to date
        run: pnpm openapi:gen && git diff --exit-code src/api/openapi/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_REDIS_URL: redis://localhost:6379
