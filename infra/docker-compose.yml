# Local development stack (HLD sections 3 and 4).
#   docker compose -f infra/docker-compose.yml --profile localdb up -d   infra only; run api + worker on the host (pnpm dev)
#   docker compose -f infra/docker-compose.yml --profile localdb --profile app up -d   also runs api + worker in containers
#   (the vm-manager and the agent image are built from ../vm-manager)
#   docker compose -f infra/docker-compose.yml --profile egress-test run --rm egress-test
#
# Databases: three, one each for the backend, the vm-manager and LiteLLM. Their addresses come from
# BACKEND_DATABASE_URL, VM_MANAGER_DATABASE_URL and LITELLM_DATABASE_URL. Not set, they point at
# the `postgres` service below, which starts only with `--profile localdb` (the laptop). The test
# server sets all three to Neon (managed Postgres) in compose.env and never starts `postgres`.
#
# Networks:
#   edge     Caddy + api. Only Caddy publishes ports (80/443).
#   platform api, worker, vm-manager, postgres (laptop only), redis, litellm, egress-proxy. No published ports except
#            127.0.0.1 bindings for local dev. Outbound internet is allowed (the worker calls Telegram,
#            Composio, …; LiteLLM calls the model providers). Nothing on it is reachable from outside.
#   sandbox  user containers + egress-proxy + vm-manager. `internal: true`: no route to the internet,
#            the egress proxy is the only way out.
name: personal-agent

x-healthcheck: &hc
  interval: 5s
  timeout: 3s
  retries: 20

networks:
  edge: {}
  platform: {}
  sandbox:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
          # Dynamic addresses (vm-manager, user containers) come from the upper half only, so
          # the egress proxy's fixed 172.30.0.2 is never handed to a container that started first.
          ip_range: 172.30.128.0/17

secrets:
  # Only the `web` build reads it. The default is an empty file, so nothing else needs it to exist.
  clerk_secret_key:
    file: ${CLERK_SECRET_FILE:-/dev/null}

volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
      # The web app's own host name (the `web` service below). Unused until that service runs.
      WEB_DOMAIN: ${WEB_DOMAIN:-web.localhost}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:3000}
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    networks: [edge]
    healthcheck:
      <<: *hc
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']

  # Laptop only (`--profile localdb`). The server's databases are on Neon (see the top).
  postgres:
    image: postgres:16
    restart: unless-stopped
    profiles: [localdb]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [platform]
    healthcheck:
      <<: *hc
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-agent}']

  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]
    networks: [platform]
    healthcheck:
      <<: *hc
      test: ['CMD', 'redis-cli', 'ping']

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      # On Neon: the direct host (no `-pooler`). LiteLLM's Prisma sets up its tables at start and
      # that does not work through the pooler.
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-dev-master-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Needed for users' own API keys: the backend adds one model per such user at runtime.
      # LiteLLM encrypts those keys with LITELLM_MASTER_KEY (no LITELLM_SALT_KEY is set; an empty
      # one would be used as the key), so never change the master key while own keys are stored.
      STORE_MODEL_IN_DB: 'True'
    ports: ['127.0.0.1:4000:4000']
    volumes: ['./litellm/config.yaml:/app/config.yaml:ro']
    # `required: false`: wait for the local database only when it runs (`--profile localdb`).
    depends_on:
      postgres: { condition: service_healthy, required: false }
    networks: [platform]
    healthcheck:
      <<: *hc
      retries: 60
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request;urllib.request.urlopen(''http://127.0.0.1:4000/health/liveliness'')"',
        ]

  egress-proxy:
    image: ubuntu/squid:latest
    # `always`, not `unless-stopped`: the vm-manager reloads Squid with `docker kill -s HUP`, and Docker
    # marks a container that was sent ANY signal that way as "stopped by hand". With unless-stopped it
    # then stays down after a server reboot. The explicit stop signal keeps a HUP from also switching
    # off restart-on-exit (Docker does that when no stop signal is set).
    restart: always
    stop_signal: SIGTERM
    container_name: egress-proxy
    # Squid must be PID 1: the vm-manager applies allowlist changes with `docker kill -s HUP`, and
    # the image's bash entrypoint (PID 1) would silently drop the signal. The tail keeps the
    # logs on the container's stdout like the stock entrypoint does. A hard stop (server reboot)
    # leaves /run/squid.pid behind saying "PID 1", which is Squid's own PID on the next start, so
    # it would refuse to start ("already running"): remove the stale file first.
    entrypoint:
      - /bin/bash
      - -c
      - >-
        rm -f /run/squid.pid;
        tail -F /var/log/squid/access.log /var/log/squid/cache.log 2>/dev/null &
        /usr/sbin/squid -Nz -f /etc/squid/squid.conf &&
        exec /usr/sbin/squid -f /etc/squid/squid.conf -NYC
    command: []
    volumes:
      - ./egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./egress-proxy/allowlists:/etc/squid/allowlists:ro
    networks:
      platform: {}
      sandbox:
        ipv4_address: 172.30.0.2
    healthcheck:
      <<: *hc
      test: ['CMD-SHELL', 'squid -k check']

  vm-manager:
    build: ../../vm-manager
    environment:
      # On Neon: the direct host. Its migrations hold a lock for the whole session, which the
      # pooler does not keep.
      DATABASE_URL: ${VM_MANAGER_DATABASE_URL:-postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/vm_manager}
      VM_INTERNAL_SECRET: ${VM_INTERNAL_SECRET:-dev-internal-secret-change-me-0123456789}
      SANDBOX_NETWORK: personal-agent_sandbox
      EGRESS_PROXY_URL: http://172.30.0.2:3128
      EGRESS_PROXY_CONTAINER: egress-proxy
      EGRESS_ALLOWLIST_DIR: /allowlists
      LITELLM_BASE_URL: http://litellm:4000
      PLATFORM_MCP_URL: ${PLATFORM_MCP_URL:-http://api:8080/mcp}
      AGENT_IMAGE: personal-agent/agent:dev
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runsc}
      # deploy.sh sets this to the agent image id: stopped containers are re-created from a new
      # image on their next wake (keeping /data).
      AGENT_IMAGE_VERSION: ${AGENT_IMAGE_VERSION:-dev}
      AWAKE_CAP: ${AWAKE_CAP:-15}
      SNAPSHOT_ROOT: /backups
    volumes:
      # The Docker socket is mounted ONLY here (HLD 10.2).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./egress-proxy/allowlists:/allowlists
      - ${BACKUP_HOST_DIR:-./.backups}:/backups
    ports: ['127.0.0.1:9090:9090']
    depends_on:
      postgres: { condition: service_healthy, required: false }
      agent-image: { condition: service_completed_successfully }
    networks: [platform, sandbox]
    restart: always

  # Builds the Hermes + Bridge image the vm-manager starts per user (not a running service).
  agent-image:
    build: ../../vm-manager/agent-image
    image: personal-agent/agent:dev
    entrypoint: ['true']
    network_mode: none
    restart: 'no'

  api:
    build: { context: .., dockerfile: infra/Dockerfile }
    restart: unless-stopped
    command: ['node', '--import', 'tsx', 'src/api/main.ts']
    env_file: [../.env]
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/agent}
      REDIS_URL: redis://redis:6379
      VM_MANAGER_URL: http://vm-manager:9090
      LITELLM_URL: http://litellm:4000
      GIT_COMMIT: ${GIT_COMMIT:-}
    depends_on:
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy }
    networks: [edge, platform]
    profiles: [app]

  worker:
    build: { context: .., dockerfile: infra/Dockerfile }
    restart: unless-stopped
    command: ['node', '--import', 'tsx', 'src/worker/main.ts']
    env_file: [../.env]
    volumes:
      - ${BACKUP_HOST_DIR:-./.backups}:/var/backups/personal-agent
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/agent}
      REDIS_URL: redis://redis:6379
      VM_MANAGER_URL: http://vm-manager:9090
      LITELLM_URL: http://litellm:4000
      GIT_COMMIT: ${GIT_COMMIT:-}
    depends_on:
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy }
    networks: [platform]
    profiles: [app]

  # The web app (../user-frontend-web), served by Caddy at WEB_DOMAIN. It has its own profile so
  # the backend can run where that repo isn't checked out. It talks only to the api.
  # Clerk: the publishable key is a build argument (it is compiled into the browser bundle); the
  # secret key is a build secret read from CLERK_SECRET_FILE and, at run time, comes from
  # WEB_ENV_FILE together with the publishable key. Neither file is in git.
  web:
    build:
      context: ../../user-frontend-web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      secrets: [clerk_secret_key]
    restart: unless-stopped
    env_file:
      - path: ${WEB_ENV_FILE:-../web.env}
        required: false
    environment:
      TEXTCREW_API_URL: http://api:8080
    networks: [edge]
    profiles: [web]

  # Phase 0 "done when": a container on the sandbox network can reach only the egress proxy.
  egress-test:
    image: curlimages/curl:latest
    entrypoint: ['/bin/sh', '/tests/egress-test.sh']
    volumes: ['./tests/egress-test.sh:/tests/egress-test.sh:ro']
    networks: [sandbox]
    depends_on:
      egress-proxy: { condition: service_healthy }
    profiles: [egress-test]
