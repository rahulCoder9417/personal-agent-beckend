# Egress proxy: the ONLY way out of user containers (HLD section 4).
# Everyone on the sandbox network may reach LiteLLM and the api's /mcp. Per-user allowlists
# (the user's own MCP server domains) are written by the vm-manager into allowlists/<user>.conf
# and applied with SIGHUP.
http_port 3128

acl sandbox src 172.30.0.0/16
acl SSL_ports port 443
acl Safe_ports port 80 443 4000 8080
acl CONNECT method CONNECT

acl litellm dstdomain litellm
acl litellm_port port 4000
acl platform_api dstdomain api host.docker.internal
acl platform_api_port port 8080
acl mcp_path urlpath_regex ^/mcp(/|$|\?)

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow sandbox litellm litellm_port
http_access allow sandbox platform_api platform_api_port mcp_path

include /etc/squid/allowlists/*.conf

http_access deny all

# No caching, no identifying headers.
cache deny all
via off
forwarded_for delete
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
