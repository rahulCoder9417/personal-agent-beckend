# Model names the backend uses: `cheap` (every plan) and `claude`, `gpt` (paid plans).
# Per-user virtual keys (created by the backend) restrict which of these a user may call.
model_list:
  - model_name: cheap
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      # Quicker chat (src/modules/billing/model-tuning.ts says what each does and how it was
      # checked): Anthropic's prompt cache on the system message (tools and instructions) and on
      # the last message, and a low thinking effort. A request's own effort wins.
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
      output_config:
        effort: low
  - model_name: gpt
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
      # A low reasoning effort, as for `claude` (OpenAI caches long prompts by itself).
      reasoning_effort: low
  - model_name: whisper
    litellm_params:
      model: openai/whisper-1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: audio_transcription

router_settings:
  # Backup model when a provider is down (HLD 10.1).
  fallbacks:
    - claude: [cheap]
    - gpt: [cheap]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
